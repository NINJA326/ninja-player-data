<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>NINJA 選手カルテ</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root{
      --bg:#07101f;
      --panel:#e8edf3;
      --paper:#fff;
      --ink:#172033;
      --muted:#68768a;
      --line:#d6dde7;
      --green:#2f9e66;
      --orange:#d89000;
      --blue:#3c7fd1;
      --purple:#7653b7;
      --accent:#35c97b;
      --danger:#b42318;
    }
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{
      margin:0;
      background:linear-gradient(145deg,#07101f,#0c1728 55%,#081221);
      color:#f4f7fb;
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
      min-height:100vh;
    }
    button{font:inherit}
    .app{max-width:880px;margin:0 auto;padding:10px}
    .toolbar{
      position:sticky;top:0;z-index:20;
      display:flex;justify-content:space-between;align-items:center;gap:10px;
      padding:10px 0 12px;
      background:linear-gradient(180deg,#07101f 82%,rgba(7,16,31,0));
    }
    .toolbar-brand small{
      display:block;color:var(--accent);font-size:10px;font-weight:900;letter-spacing:.16em;
    }
    .toolbar-brand strong{display:block;margin-top:2px;font-size:20px}
    .toolbar-actions{display:flex;gap:8px}
    .btn{
      min-height:44px;border:0;border-radius:12px;padding:0 14px;
      background:#24344b;color:#fff;font-weight:800;
    }
    .btn.primary{background:var(--accent);color:#062014}
    .loading{
      min-height:70vh;display:grid;place-items:center;text-align:center;color:#9fb0c6;
    }
    .spinner{
      width:34px;height:34px;margin:0 auto 14px;border:3px solid #203450;
      border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .hidden{display:none!important}
    .report-shell{
      background:var(--panel);border-radius:16px;padding:9px;
    }
    .parent-report-paper{
      width:min(794px,100%);
      margin:0 auto;
      background:var(--paper);
      color:var(--ink);
      box-shadow:0 8px 30px rgba(0,0,0,.25);
      padding:30px 30px 34px;
    }
    .report-header{
      border-bottom:3px solid var(--ink);
      padding-bottom:14px;margin-bottom:20px;
    }
    .report-brand{
      font-size:12px;font-weight:800;letter-spacing:.14em;color:#52708f;
    }
    .report-title{
      font-size:28px;font-weight:900;margin:4px 0 12px;
    }
    .report-meta{
      display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;font-size:13px;
    }
    .report-meta div{
      border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:0;
    }
    .report-meta small{display:block;color:var(--muted);margin-bottom:3px}
    .report-meta strong{display:block;word-break:break-word}
    .report-summary-grid{
      display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0;
    }
    .report-box{
      border:1px solid var(--line);border-radius:11px;padding:13px;break-inside:avoid;
    }
    .report-box.full{grid-column:1/-1}
    .report-box h4{
      margin:0 0 9px;font-size:15px;border-left:4px solid var(--green);padding-left:8px;
    }
    .report-list{display:grid;gap:8px}
    .report-row{
      display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
      border-bottom:1px solid #edf1f5;padding-bottom:7px;font-size:12.5px;line-height:1.55;
    }
    .report-row:last-child{border-bottom:0;padding-bottom:0}
    .report-row span{color:#4d5e73;flex:0 0 auto}
    .report-row strong{text-align:right;font-weight:800}
    .agility-grid{
      display:grid;grid-template-columns:1fr 1fr;gap:8px;
    }
    .agility-card{
      border:1px solid #dce3eb;border-radius:10px;padding:10px;background:#fbfcfe;
    }
    .agility-card-head{
      display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:5px;
    }
    .agility-card .name{font-weight:800;font-size:12px;margin-bottom:0}
    .agility-rank{
      flex:0 0 auto;
      font-size:12px;
      font-weight:900;
      color:#2f6fbd;
      white-space:nowrap;
    }
    .agility-card .value{font-size:17px;font-weight:900}
    .agility-card .sub{font-size:10px;color:#718096;margin-top:3px;line-height:1.45}
    .shot-chart{
      position:relative;
      width:100%;
      max-width:520px;
      margin:8px auto 2px;
      aspect-ratio:.92/1;
      background:#d7a86e;
      border:4px solid #f5f5f5;
      border-radius:8px;
      overflow:hidden;
      box-shadow:0 0 0 1px #cbd5df;
    }
    .shot-chart svg{position:absolute;inset:0;width:100%;height:100%}
    .shot-dot{
      position:absolute;
      transform:translate(-50%,-50%);
      width:54px;height:54px;
      border:3px solid #fff;
      border-radius:50%;
      display:grid;
      place-items:center;
      text-align:center;
      box-shadow:0 2px 7px rgba(0,0,0,.3);
      padding:3px;
      font-weight:900;
      line-height:1;
      color:#fff;
      z-index:2;
    }
    .shot-dot strong{font-size:14px;line-height:1}
    .shot-dot span{display:block;font-size:8px;line-height:1.1;margin-top:2px;font-weight:700}
    .shot-dot .crown{
      position:absolute;top:-15px;left:50%;transform:translateX(-50%);
      font-size:18px;line-height:1;pointer-events:none;
    }
    /* iPhone等の狭い画面では、座標を変えずにマーカーだけ少し小さくする。 */
    @media(max-width:700px){
      .shot-dot{width:46px;height:46px;border-width:2px;padding:2px}
      .shot-dot strong{font-size:12px}
      .shot-dot span{font-size:7px;margin-top:1px}
      .shot-dot .crown{top:-13px;font-size:15px}
    }
    .shot-dot.rank-red{background:#b42318}
    .shot-dot.rank-yellow{background:#d4a017;color:#16120a}
    .shot-dot.rank-green{background:#1f8a4c}
    .shot-dot.rank-silver{
      background:linear-gradient(145deg,#f7f7f7,#a9b0b7 55%,#737b84);
      color:#111;border-color:#fff
    }
    .shot-dot.rank-gold{
      background:linear-gradient(145deg,#fff3a6,#d4af37 55%,#8f6b00);
      color:#1a1400;border-color:#fff4b8
    }
    .report-coach-title{
      margin-top:24px;padding:12px 14px;
      border-top:2px solid var(--ink);border-bottom:1px solid var(--line);
      display:flex;align-items:baseline;justify-content:space-between;gap:12px;
      break-after:avoid;page-break-after:avoid;
    }
    .report-coach-title strong{font-size:20px}
    .report-coach-title span{font-size:11.5px;color:var(--muted)}
    .report-section{
      margin-top:18px;break-inside:auto;page-break-inside:auto;
    }
    .report-section h3{
      font-size:17px;margin:0 0 10px;padding:8px 11px;background:#edf3f8;
      border-left:5px solid var(--blue);
      break-after:avoid;page-break-after:avoid;
    }
    .report-text{
      font-size:13.5px;line-height:1.9;white-space:pre-wrap;word-break:break-word;
      overflow-wrap:anywhere;min-height:36px;padding:0 2px;
    }
    .report-section.good h3{border-left-color:var(--green)}
    .report-section.improve h3{border-left-color:var(--orange)}
    .report-section.direction h3{border-left-color:var(--blue)}
    .report-section.overall h3{border-left-color:var(--purple)}
    .report-alert{
      margin-top:16px;border:1px solid #e0a83b;background:#fff8e8;
      border-radius:10px;padding:11px 13px;font-size:12px;line-height:1.65;
    }
    .report-footer{
      margin-top:24px;padding-top:12px;border-top:1px solid var(--line);
      text-align:right;font-size:11px;color:#718096;
    }
    .error{
      padding:20px;border:1px solid #7a3340;border-radius:14px;background:#3b1720;color:#ffd2d7;
    }
    @media(max-width:700px){
      .app{padding:6px}
      .toolbar{padding:7px 2px 10px}
      .toolbar-brand strong{font-size:17px}
      .toolbar-actions{gap:6px}
      .btn{min-height:42px;padding:0 11px;font-size:13px}
      .report-shell{padding:4px;border-radius:8px}
      .parent-report-paper{padding:22px 16px 28px}
      .report-title{font-size:25px}
      .report-meta{grid-template-columns:1fr 1fr}
      .report-summary-grid{grid-template-columns:1fr}
      .report-box.full{grid-column:auto}
      .agility-grid{grid-template-columns:1fr 1fr}
      .report-coach-title{padding:10px 7px}
      .report-coach-title strong{font-size:18px}
      .report-text{font-size:13px;line-height:1.85}
    }
    @media(max-width:410px){
      .report-meta{grid-template-columns:1fr 1fr}
      .agility-grid{grid-template-columns:1fr}
    }
    @media print{
      @page{size:A4;margin:8mm}
      html,body{background:#fff!important}
      .toolbar,.loading,#errorView{display:none!important}
      .app{max-width:none;padding:0}
      .report-shell{padding:0;background:#fff}
      .parent-report-paper{
        width:100%;box-shadow:none;padding:0;color:#172033;
      }
      .report-meta{grid-template-columns:repeat(4,1fr)}
      .report-summary-grid{grid-template-columns:1fr 1fr}
      .report-box.full{grid-column:1/-1}
      .report-section,.report-box,.agility-card{break-inside:avoid}
      .shot-chart{max-width:430px}
    }
  </style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <div class="toolbar-brand">
      <small>NINJA AIRS</small>
      <strong>選手カルテ</strong>
    </div>
    <div class="toolbar-actions">
      <button class="btn" type="button" onclick="history.back()">戻る</button>
    </div>
  </div>

  <section id="loadingView" class="loading">
    <div>
      <div class="spinner"></div>
      <div>本人確認とカルテを読み込んでいます…</div>
    </div>
  </section>

  <section id="reportView" class="hidden">
    <div class="report-shell">
      <article class="parent-report-paper">
        <header class="report-header">
          <div class="report-brand">NINJA AIRS U15</div>
          <div class="report-title">選手カルテ</div>
          <div class="report-meta">
            <div><small>選手名</small><strong id="playerName">-</strong></div>
            <div><small>カテゴリー</small><strong id="playerCategory">-</strong></div>
            <div><small>記入者</small><strong id="writerName">未設定</strong></div>
            <div><small>作成日</small><strong id="createdDate">-</strong></div>
          </div>
        </header>

        <div class="report-summary-grid">
          <section class="report-box">
            <h4>身体測定</h4>
            <div id="bodySummary"></div>
          </section>

          <section class="report-box">
            <h4>アジリティ</h4>
            <div id="agilitySummary"></div>
          </section>

          <section class="report-box full">
            <h4>シューティング</h4>
            <div id="shootingSummary"></div>
          </section>

          <section class="report-box full">
            <h4>シュートチャート</h4>
            <div id="shotChartSummary"></div>
          </section>
        </div>

        <div class="report-coach-title">
          <strong>コーチ所見</strong>
          <span>現在の成長と次の取り組み</span>
        </div>

        <section class="report-section good">
          <h3>いいところ</h3>
          <div id="goodText" class="report-text">未記入</div>
        </section>

        <section class="report-section improve">
          <h3>改善点</h3>
          <div id="improvementText" class="report-text">未記入</div>
        </section>

        <section class="report-section direction">
          <h3>方向性</h3>
          <div id="directionText" class="report-text">未記入</div>
        </section>

        <section class="report-section overall">
          <h3>総合所見</h3>
          <div id="overallText" class="report-text">未記入</div>
        </section>

        <div id="recordAlert" class="report-alert hidden"></div>
        <footer class="report-footer">NINJA AIRS U15</footer>
      </article>
    </div>
  </section>

  <section id="errorView" class="hidden">
    <div class="error">
      <strong>カルテを開けませんでした</strong>
      <div id="errorText"></div>
    </div>
  </section>
</div>

<script>
'use strict';
const PLAYER_CARD_VERSION='v13';

const LIFF_ID='2010789200-d4tyvqcE';
const GAS_URL='https://script.google.com/macros/s/AKfycbxbnca_UIigFLiSfTGOtlU4871H_cm9rHy8iutFT5P9HJR5w3TBvBoA0IZ5fQWkUJRw/exec';

window.addEventListener('load',init);

async function init(){
  try{
    if(!window.liff)throw new Error('LIFF SDKを読み込めませんでした。');
    await withTimeout(liff.init({liffId:LIFF_ID}),15000,'LINE認証の初期化がタイムアウトしました。');
    if(!liff.isLoggedIn()){liff.login();return;}
    const idToken=liff.getIDToken();
    if(!idToken)throw new Error('LINE認証情報を取得できませんでした。');

    const result=await jsonp({action:'playerCard.listMine',idToken});
    if(!result||result.status==='error'||result.success===false){
      throw new Error(result&&result.message?result.message:'選手カルテを取得できませんでした。');
    }
    render(result);
  }catch(error){
    showError(error&&error.message?error.message:String(error));
  }
}

function render(data){
  const p=data.player||{};
  setText('playerName',p.name||p.playerName||'選手');
  setText('playerCategory',p.category||'未設定');
  setText('createdDate',formatJPDate(data.generatedAt||new Date().toISOString()));

  const fb=data.feedback||{};
  setText('writerName',fb.writerName||fb.createdBy||fb.coachName||fb.author||'未設定');

  renderBody(data.growth&&Array.isArray(data.growth.records)?data.growth.records:[]);
  renderAgility(
    data.agility&&Array.isArray(data.agility.records)?data.agility.records:[],
    data.ranking||null,
    data.player||{}
  );
  renderShooting(data.shooting||null);
  renderShotChart(data.shooting||null);
  renderFeedback(fb);
  renderRecordAlert(data);

  document.title=`${p.name||p.playerName||'選手'}_選手カルテ`;
  showOnly('reportView');
}

function renderBody(records){
  const el=document.getElementById('bodySummary');
  if(!records.length){
    el.innerHTML='<div class="report-row"><span>記録</span><strong>未記録</strong></div>';
    return;
  }
  const sorted=[...records].sort((a,b)=>dateKey(a)-dateKey(b));
  const first=sorted[0]||{};
  const latest=sorted[sorted.length-1]||{};
  const rows=[
    ['測定日',formatJPDate(latest.date||latest.measuredAtIso||latest.measuredAt||'')],
    ['身長',unit(latest.height,'cm')],
    ['体重',unit(latest.weight,'kg')]
  ];
  const h1=num(first.height),h2=num(latest.height),w1=num(first.weight),w2=num(latest.weight);
  if(Number.isFinite(h1)&&Number.isFinite(h2))rows.push(['身長 初回→現在',signed(h2-h1,'cm')]);
  if(Number.isFinite(w1)&&Number.isFinite(w2))rows.push(['体重 初回→現在',signed(w2-w1,'kg')]);

  el.innerHTML=`<div class="report-list">${rows.map(([k,v])=>row(k,v)).join('')}</div>`;
}

function renderAgility(records,ranking,player){
  const el=document.getElementById('agilitySummary');
  if(!records.length){
    el.innerHTML='<div class="report-row"><span>記録</span><strong>未記録</strong></div>';
    return;
  }

  const normalized=records.map(r=>{
    const name=normalizeAgilityName(r.event||r.type||r.item||r.measurement||r.name||'');
    return Object.assign({},r,{__name:name});
  }).filter(r=>r.__name);

  const byName={};
  normalized.forEach(r=>{
    const name=r.__name;
    if(!byName[name]||dateKey(r)>=dateKey(byName[name]))byName[name]=r;
  });

  const order=[
    '20mシャトルラン',
    '反復横跳び',
    'L字コーン',
    '垂直跳び',
    '120回ハンドリング',
    '龍ラン 1周目',
    '龍ラン 2周目',
    '龍ラン'
  ];

  const cards=Object.entries(byName)
    .sort((a,b)=>{
      const ai=order.indexOf(a[0]),bi=order.indexOf(b[0]);
      return (ai<0?999:ai)-(bi<0?999:bi);
    })
    .map(([name,r])=>{
      const value=formatAgilityValue(name,r);
      const date=formatJPDate(r.date||r.measuredAt||r.measuredAtIso||'');
      const rank=agilityRankText(name,ranking,player);

      return `<div class="agility-card">
        <div class="agility-card-head">
          <div class="name">${esc(agilityDisplayName(name))}</div>
          ${rank?`<div class="agility-rank">${esc(rank)}</div>`:''}
        </div>
        <div class="value">${esc(value)}</div>
        <div class="sub">${esc(date||'日付なし')}</div>
      </div>`;
    });

  el.innerHTML=`<div class="agility-grid">${cards.join('')}</div>`;
}

function normalizeAgilityName(value){
  const text=String(value||'').normalize('NFKC').replace(/\s+/g,'');
  if(!text)return '';
  if(text.includes('龍ラン')||text.includes('竜ラン')||text.includes('りゅうラン')||text.includes('リュウラン')){
    if(text.includes('1周'))return '龍ラン 1周目';
    if(text.includes('2周'))return '龍ラン 2周目';
    return '龍ラン';
  }
  if(text.includes('シャトル'))return '20mシャトルラン';
  if(text.includes('反復横'))return '反復横跳び';
  if((text.includes('L字')||text.includes('l字'))&&text.includes('コーン'))return 'L字コーン';
  if(text.includes('垂直'))return '垂直跳び';
  if(text.includes('120')&&text.includes('ハンドリング'))return '120回ハンドリング';
  return String(value||'').trim();
}

function agilityDisplayName(name){
  return name==='龍ラン'?'龍ラン 合計':name;
}

function formatAgilityValue(name,r){
  const raw=agilityRawValue(r);
  if(raw===null)return '記録あり';

  const n=Number(raw);
  if(!Number.isFinite(n))return String(raw);

  if(name==='20mシャトルラン'||name==='反復横跳び'){
    return `${formatSimpleNumber(n)}回`;
  }

  if(name==='垂直跳び'){
    return `${formatSimpleNumber(n)}cm`;
  }

  if(name==='龍ラン'||name==='龍ラン 1周目'||name==='龍ラン 2周目'){
    return formatMinutesSeconds(n);
  }

  if(name==='L字コーン'||name==='120回ハンドリング'){
    return `${formatSimpleNumber(n)}秒`;
  }

  const explicitUnit=String(r.unit||'').trim();
  return explicitUnit?`${formatSimpleNumber(n)}${explicitUnit}`:formatSimpleNumber(n);
}

function agilityRawValue(r){
  const c=[
    r.value,r.result,r.score,r.count,r.time,r.seconds,r.record,
    r.shuttle,r.shuttleRun,r.verticalJump,r.sideStep,r.sideSteps,
    r.lCone,r.handling120,r.ryuRun,r.ryuRunTotal,
    r.ryuRunLap1,r.ryuRunLap2
  ];
  const v=c.find(x=>x!==undefined&&x!==null&&String(x).trim()!=='');
  return v===undefined?null:v;
}

function formatSimpleNumber(value){
  const n=Number(value);
  if(!Number.isFinite(n))return String(value);
  return Number.isInteger(n)?String(n):String(Math.round(n*100)/100);
}

function formatMinutesSeconds(seconds){
  const total=Math.max(0,Math.round(Number(seconds)||0));
  const minutes=Math.floor(total/60);
  const remain=total%60;
  return `${minutes}分${String(remain).padStart(2,'0')}秒`;
}

function agilityRankText(name,ranking,player){
  // 龍ラン1周目・2周目はランキング対象外。合計だけ順位表示。
  const rankingName=(name==='龍ラン 1周目'||name==='龍ラン 2周目')?'':name;
  if(!rankingName||!ranking||!ranking.agility)return '';

  const group=ranking.agility[rankingName];
  const rows=group&&Array.isArray(group.rows)?group.rows:[];
  if(!rows.length)return '';

  const playerId=String(
    ranking.currentPlayerId||
    player.playerId||
    player.id||
    ''
  ).trim();

  const row=rows.find(x=>String(x.playerId||'').trim()===playerId);
  if(!row||row.rank===null||row.rank===undefined)return '';

  const gender=String(ranking.gender||'').trim();
  return `${gender?gender+' ':''}${row.rank}位`;
}

function renderShooting(shooting){
  const el=document.getElementById('shootingSummary');
  if(!shooting){
    el.innerHTML='<div class="report-row"><span>記録</span><strong>未記録</strong></div>';
    return;
  }

  const rows=[];
  const total=shooting.total||{};
  const made=firstNumber(total.made,total.success,total.makes,total.hit);
  const attempts=firstNumber(total.attempts,total.shots,total.total,total.trials);
  const latestDate=shooting.latestDate||shooting.lastRecordedAt||shooting.updatedAt||'';

  if(latestDate)rows.push(['最終記入日',formatJPDate(latestDate)]);
  if(made!==null&&attempts!==null){
    rows.push(['合計',`${made}本成功 / ${attempts}本試投 / 成功率 ${pct(made,attempts)}`]);
  }

  const types=Array.isArray(shooting.byType)?shooting.byType:[];
  types.forEach(item=>{
    const name=String(item.type||item.shotType||item.name||'').trim();
    if(!name)return;
    const m=firstNumber(item.made,item.success,item.makes,item.hit);
    const a=firstNumber(item.attempts,item.shots,item.total,item.trials);
    if(m!==null&&a!==null)rows.push([name,`${m}本成功 / ${a}本試投 / ${pct(m,a)}`]);
  });

  if(!rows.length)rows.push(['記録','シュート記録あり']);
  el.innerHTML=`<div class="report-list">${rows.map(([k,v])=>row(k,v)).join('')}</div>`;
}

function renderShotChart(shooting){
  const el=document.getElementById('shotChartSummary');

  // byPosition は現在の集計処理によって shotType が失われる場合があるため使用しない。
  // 元レコードには shotType と position が両方保持されているので、
  // 既存の成長記録/コーチアプリと同じ type + position 単位でここで再集計する。
  const records=Array.isArray(shooting&&shooting.records)
    ? shooting.records.filter(function(r){
        return Number(r&&r.attempts||0)>0;
      })
    : [];

  if(!records.length){
    el.innerHTML='<div class="report-row"><span>チャート</span><strong>ポジション別記録なし</strong></div>';
    return;
  }

  const map={};

  records.forEach(function(r){
    const type=String(r.shotType||r.type||'').trim();
    const position=String(r.position||'').trim();

    if(!type||!position)return;

    const key=type+'|||'+position;

    if(!map[key]){
      map[key]={
        type:type,
        position:position,
        made:0,
        attempts:0
      };
    }

    map[key].made+=Number(r.made||0);
    map[key].attempts+=Number(r.attempts||0);
  });

  const rows=Object.values(map)
    .filter(function(r){
      return r.attempts>0;
    })
    .map(function(r){
      return Object.assign({},r,{
        rate:Math.round((r.made/r.attempts)*1000)/10
      });
    })
    .sort(function(a,b){
      return (
        a.type.localeCompare(b.type,'ja') ||
        b.attempts-a.attempts ||
        b.rate-a.rate
      );
    });

  if(!rows.length){
    el.innerHTML='<div class="report-row"><span>チャート</span><strong>ポジション別記録なし</strong></div>';
    return;
  }

  const markers=rows.map(function(r){
    const p=courtPosition(r.position,r.type);
    const rank=shotRank(r.rate);
    const crown=rank.crown
      ? '<span class="crown">♛</span>'
      : '';

    return `<div
      class="shot-dot ${rank.cls}"
      style="left:${p.x}%;top:${p.y}%"
      title="${esc(r.type)} / ${esc(r.position)}"
      aria-label="${esc(r.position)} ${esc(r.type)} 成功率${formatRate(r.rate)}% ${r.made}/${r.attempts}"
    >
      ${crown}
      <div>
        <strong>${formatRate(r.rate)}%</strong>
        <span>${esc(r.type)}<br>${r.made}/${r.attempts}</span>
      </div>
    </div>`;
  }).join('');

  el.innerHTML=`<div class="shot-chart" aria-label="シューティングポジション別成功率">
    <svg viewBox="0 0 920 1000" aria-hidden="true">
      <rect x="8" y="8" width="904" height="984" rx="4" fill="none" stroke="#ffffff" stroke-width="10"/>
      <line x1="8" y1="120" x2="912" y2="120" stroke="#ffffff" stroke-width="10"/>
      <path d="M350 120 A110 110 0 0 0 570 120" fill="none" stroke="#ffffff" stroke-width="10"/>

      <line x1="105" y1="992" x2="105" y2="690" stroke="#ffffff" stroke-width="10"/>
      <line x1="815" y1="992" x2="815" y2="690" stroke="#ffffff" stroke-width="10"/>
      <path d="M105 690 A365 365 0 0 1 815 690" fill="none" stroke="#ffffff" stroke-width="10"/>

      <rect x="315" y="655" width="290" height="337" fill="#f07c00" stroke="#ffffff" stroke-width="10"/>

      <path d="M365 655 A95 95 0 0 1 555 655" fill="none" stroke="#ffffff" stroke-width="10"/>
      <path d="M365 655 A95 95 0 0 0 555 655" fill="none" stroke="#ffffff" stroke-width="10" stroke-dasharray="18 16"/>

      <path d="M395 925 A65 65 0 0 1 525 925" fill="none" stroke="#ffffff" stroke-width="10"/>
      <line x1="395" y1="955" x2="525" y2="955" stroke="#ffffff" stroke-width="12"/>
      <circle cx="460" cy="925" r="20" fill="none" stroke="#ffffff" stroke-width="8"/>
    </svg>
    ${markers}
  </div>`;
}

function normalizePositionName(name){
  return String(name||'')
    .normalize('NFKC')
    .replace(/\s+/g,'')
    .replace(/[（(].*?[）)]/g,'');
}

// 現在正常に動いている NINJA成長記録 と同じ固定座標。
function courtPosition(name,type){
  const n=normalizePositionName(name);
  const t=normalizePositionName(type);

  if(n.includes('マイカン')||t.includes('マイカン')){
    return {x:50,y:91};
  }

  const is3=String(type||'').includes('3P');

  const map=[
    {keys:['右0度','右コーナー','右底角'],x:is3?94:76,y:82},
    {keys:['左0度','左コーナー','左底角'],x:is3?6:24,y:82},
    {keys:['右45度','右ウィング'],x:is3?87:70,y:is3?52:66},
    {keys:['左45度','左ウィング'],x:is3?13:30,y:is3?52:66},
    {keys:['90度','トップ','正面'],x:50,y:is3?37:59},
    {keys:['右エルボー'],x:61,y:69},
    {keys:['左エルボー'],x:39,y:69},
    {keys:['右ショートコーナー'],x:72,y:84},
    {keys:['左ショートコーナー'],x:28,y:84},
    {keys:['右ブロック'],x:58,y:88},
    {keys:['左ブロック'],x:42,y:88},
    {keys:['ゴール下','リング下','ペイント'],x:50,y:91},
    {keys:['フリースロー','FT'],x:50,y:67}
  ];

  const hit=map.find(function(m){
    return m.keys.some(function(k){
      return n.includes(k);
    });
  });

  return hit||{x:50,y:is3?37:66};
}

function shotRank(rate){
  const r=Number(rate||0);
  if(r<=20)return {cls:'rank-red',label:'赤',crown:false};
  if(r<=35)return {cls:'rank-yellow',label:'黄',crown:false};
  if(r<=45)return {cls:'rank-green',label:'緑',crown:false};
  if(r<=60)return {cls:'rank-silver',label:'銀',crown:true};
  return {cls:'rank-gold',label:'金',crown:true};
}

function formatRate(rate){
  const n=Number(rate||0);
  return Number.isInteger(n)?String(n):n.toFixed(1);
}

function renderFeedback(feedback){
  const direct={
    good:clean(feedback.goodPoints||feedback.good||''),
    improve:clean(feedback.improvementPoints||feedback.improvement||feedback.improve||''),
    direction:clean(feedback.futureDirection||feedback.direction||''),
    summary:clean(feedback.overallComment||feedback.summary||'')
  };

  const parsed=parseFeedback(feedback.feedbackText||feedback.coachComment||'');
  direct.good=direct.good||parsed.good;
  direct.improve=direct.improve||parsed.improve;
  direct.direction=direct.direction||parsed.direction;
  direct.summary=direct.summary||parsed.summary||clean(feedback.feedbackText||feedback.coachComment||'');

  setText('goodText',direct.good||'未記入');
  setText('improvementText',direct.improve||'未記入');
  setText('directionText',direct.direction||'未記入');
  setText('overallText',direct.summary||'未記入');
}

function renderRecordAlert(data){
  const alerts=[];
  const body=data.growth&&Array.isArray(data.growth.records)?data.growth.records:[];
  if(body.length){
    const latest=[...body].sort((a,b)=>dateKey(a)-dateKey(b)).at(-1);
    const raw=latest&&(latest.date||latest.measuredAtIso||latest.measuredAt);
    if(raw){
      const days=daysAgo(raw);
      if(days!==null&&days>=60)alerts.push(`身体測定：最新入力から${days}日経過しています。`);
    }
  }
  const el=document.getElementById('recordAlert');
  if(alerts.length){
    el.innerHTML=`<strong>記録について</strong><br>${alerts.map(esc).join('<br>')}`;
    el.classList.remove('hidden');
  }else{
    el.classList.add('hidden');
    el.innerHTML='';
  }
}


function parseFeedback(text){
  const raw=String(text||'').replace(/<br\s*\/?>/gi,'\n').replace(/\r\n?/g,'\n').trim();
  const result={good:'',improve:'',direction:'',summary:''};
  if(!raw)return result;
  const aliases={
    good:['いいところ','良いところ','強み','評価できる点'],
    improve:['改善点','課題','今後の課題'],
    direction:['方向性','今後の方向性','取り組み方'],
    summary:['総合所見','総評','まとめ']
  };
  const lookup={};
  Object.entries(aliases).forEach(([k,list])=>list.forEach(v=>lookup[v]=k));
  const bucket={good:[],improve:[],direction:[],summary:[]};
  let current='';
  raw.split('\n').forEach(line=>{
    const h=String(line||'').replace(/^\s*#{1,6}\s*/,'').replace(/\*\*/g,'').replace(/[【】\[\]：:]/g,'').replace(/\s+/g,'').trim();
    if(lookup[h]){current=lookup[h];return}
    if(current)bucket[current].push(line);
  });
  Object.keys(bucket).forEach(k=>result[k]=clean(bucket[k].join('\n')));
  return result;
}

function clean(v){
  return String(v||'')
    .replace(/<br\s*\/?>/gi,'\n')
    .replace(/<[^>]+>/g,'')
    .replace(/^\s*#{1,6}\s*/gm,'')
    .replace(/^\s*[-*・]\s*/gm,'')
    .replace(/\*\*/g,'')
    .trim();
}
function row(k,v){return `<div class="report-row"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`}
function agilityValue(r){
  const c=[r.value,r.result,r.score,r.count,r.time,r.seconds,r.record,r.shuttle,r.verticalJump,r.sideStep,r.lCone,r.ryuRun];
  const v=c.find(x=>x!==undefined&&x!==null&&String(x).trim()!=='');
  return v===undefined?'記録あり':String(v);
}
function unit(v,u){return v===undefined||v===null||String(v).trim()===''?'未記録':`${v}${u}`}
function num(v){const n=Number(v);return Number.isFinite(n)?n:NaN}
function signed(v,u){if(!Number.isFinite(v))return '未記録';const s=Math.abs(v-Math.round(v))<.001?String(Math.round(v)):v.toFixed(1);return `${v>0?'+':''}${s}${u}`}
function pct(m,a){return `${a>0?(m/a*100).toFixed(1):'0.0'}%`}
function firstNumber(...v){for(const x of v){if(x===undefined||x===null||String(x).trim()==='')continue;const n=Number(x);if(Number.isFinite(n))return n}return null}
function dateKey(obj){
  const raw=typeof obj==='string'?obj:(obj&&(obj.date||obj.measuredAt||obj.measuredAtIso||obj.createdAt||obj.updatedAt)||'');
  const t=Date.parse(String(raw||'').replace(/\//g,'-'));
  return Number.isFinite(t)?t:0;
}
function daysAgo(v){
  const t=dateKey(String(v||''));
  if(!t)return null;
  return Math.max(0,Math.floor((Date.now()-t)/86400000));
}
function formatJPDate(v){
  const s=String(v||'').trim();
  if(!s)return '未設定';
  const d=new Date(s.replace(/\//g,'-'));
  if(!Number.isNaN(d.getTime()))return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  const m=s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
  return m?`${m[1]}年${Number(m[2])}月${Number(m[3])}日`:s;
}
function setText(id,v){document.getElementById(id).textContent=v==null?'':String(v)}
function showOnly(id){['loadingView','reportView','errorView'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));window.scrollTo(0,0)}
function showError(message){setText('errorText',message||'エラーが発生しました。');showOnly('errorView')}
function jsonp(params,timeoutMs=25000){
  return new Promise((resolve,reject)=>{
    const cb='__ninjaCard_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    const timer=setTimeout(()=>{cleanup();reject(new Error('サーバー通信がタイムアウトしました。'))},timeoutMs);
    function cleanup(){clearTimeout(timer);try{delete window[cb]}catch(_){}if(s.parentNode)s.parentNode.removeChild(s)}
    window[cb]=data=>{cleanup();resolve(data)};
    s.src=GAS_URL+'?'+new URLSearchParams({...params,callback:cb,_ts:String(Date.now())}).toString();
    s.onerror=()=>{cleanup();reject(new Error('Apps Scriptへ接続できませんでした。'))};
    document.head.appendChild(s);
  });
}
function withTimeout(p,ms,msg){return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error(msg)),ms))])}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
</script>
