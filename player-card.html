<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>NINJA 選手カルテ</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root{
      --bg:#07111f;
      --panel:#0d192a;
      --line:#223653;
      --text:#f5f8fc;
      --muted:#9eb0c7;
      --accent:#37cf82;
      --blue:#5aa7ff;
      --danger:#ff6b76;
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at 90% 0%,rgba(90,167,255,.12),transparent 28%),
        linear-gradient(180deg,#07111f,#091625);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",Meiryo,sans-serif;
      -webkit-font-smoothing:antialiased;
      padding-bottom:calc(24px + var(--safe-bottom));
    }
    button{font:inherit;-webkit-tap-highlight-color:transparent}
    .app{max-width:760px;margin:0 auto;padding:14px}
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:8px 0 14px;
    }
    .brand small{
      display:block;
      color:var(--accent);
      font-size:10px;
      font-weight:900;
      letter-spacing:.16em;
      margin-bottom:3px;
    }
    .brand strong{font-size:21px}
    .actions{display:flex;gap:8px}
    .btn{
      min-height:44px;
      border-radius:13px;
      border:1px solid var(--line);
      background:#13233a;
      color:#fff;
      padding:0 14px;
      font-weight:800;
    }
    .btn.primary{
      background:var(--accent);
      border-color:var(--accent);
      color:#052116;
    }
    .loading{
      min-height:65vh;
      display:grid;
      place-items:center;
      text-align:center;
      color:var(--muted);
    }
    .spinner{
      width:34px;height:34px;
      margin:0 auto 14px;
      border:3px solid #203450;
      border-top-color:var(--accent);
      border-radius:50%;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .hidden{display:none!important}

    .paper{
      background:#fff;
      color:#111827;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 18px 50px rgba(0,0,0,.28);
    }
    .report-header{
      padding:22px;
      background:linear-gradient(135deg,#101827,#18263c);
      color:#fff;
    }
    .report-brand{
      color:#74e6a8;
      font-size:11px;
      font-weight:900;
      letter-spacing:.16em;
    }
    .report-title{
      font-size:28px;
      font-weight:900;
      margin:4px 0 14px;
    }
    .meta{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }
    .meta div{
      border:1px solid rgba(255,255,255,.18);
      border-radius:11px;
      padding:9px 10px;
      background:rgba(255,255,255,.05);
    }
    .meta small{display:block;color:#b7c4d7;font-size:9px}
    .meta strong{display:block;margin-top:3px;font-size:13px}

    .report-body{padding:18px}
    .summary-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-bottom:16px;
    }
    .box{
      border:1px solid #d8e0ea;
      border-radius:13px;
      padding:13px;
      background:#f8fafc;
    }
    .box.full{grid-column:1/-1}
    .box h3{
      margin:0 0 9px;
      font-size:14px;
      color:#1f3a56;
    }
    .data-list{display:grid;gap:7px}
    .data-row{
      display:flex;
      justify-content:space-between;
      gap:12px;
      border-bottom:1px solid #e5eaf0;
      padding-bottom:6px;
      font-size:12px;
    }
    .data-row:last-child{border-bottom:0;padding-bottom:0}
    .data-row span{color:#64748b}
    .data-row strong{text-align:right}
    .note{font-size:11px;color:#64748b;line-height:1.6}

    .coach-title{
      margin:18px 0 10px;
      padding-bottom:8px;
      border-bottom:2px solid #1e293b;
    }
    .coach-title strong{font-size:17px}
    .coach-title span{display:block;font-size:10px;color:#64748b;margin-top:2px}
    .section{
      margin-bottom:11px;
      border-radius:12px;
      padding:13px;
      border:1px solid #d8e0ea;
      page-break-inside:avoid;
    }
    .section h3{margin:0 0 7px;font-size:14px}
    .section.good{border-left:5px solid #22a06b}
    .section.improve{border-left:5px solid #f59e0b}
    .section.direction{border-left:5px solid #3b82f6}
    .section.overall{border-left:5px solid #8b5cf6}
    .text{
      white-space:pre-wrap;
      word-break:break-word;
      font-size:12px;
      line-height:1.75;
    }
    .report-footer{
      padding:14px 18px 20px;
      color:#64748b;
      font-size:10px;
      text-align:center;
    }

    .error{
      padding:22px;
      border:1px solid #71313d;
      border-radius:16px;
      background:#35151d;
      color:#ffc4ca;
    }
    .error strong{display:block;margin-bottom:7px;font-size:18px}

    @media(max-width:560px){
      .app{padding:10px}
      .topbar{align-items:flex-start}
      .actions{flex-direction:column}
      .btn{min-height:42px;padding:0 11px}
      .report-header{padding:17px}
      .report-title{font-size:25px}
      .meta{grid-template-columns:1fr}
      .summary-grid{grid-template-columns:1fr}
      .box.full{grid-column:auto}
      .report-body{padding:13px}
    }

    @media print{
      @page{size:A4;margin:10mm}
      html,body{
        background:#fff!important;
        color:#111!important;
        padding:0!important;
      }
      .app{
        max-width:none;
        padding:0;
      }
      .topbar,.loading,#errorView{
        display:none!important;
      }
      #reportView{
        display:block!important;
      }
      .paper{
        border-radius:0;
        box-shadow:none;
      }
      .report-header{
        -webkit-print-color-adjust:exact;
        print-color-adjust:exact;
      }
      .box,.section{
        break-inside:avoid;
      }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <small>NINJA AIRS</small>
      <strong>選手カルテ</strong>
    </div>
    <div class="actions">
      <button class="btn" type="button" onclick="history.back()">戻る</button>
      <button id="printBtn" class="btn primary" type="button">PDF保存 / 印刷</button>
    </div>
  </div>

  <section id="loadingView" class="loading">
    <div>
      <div class="spinner"></div>
      <div>本人確認とカルテを読み込んでいます…</div>
    </div>
  </section>

  <section id="reportView" class="hidden">
    <article class="paper">
      <header class="report-header">
        <div class="report-brand">NINJA AIRS U15</div>
        <div class="report-title">選手カルテ</div>
        <div class="meta">
          <div><small>選手名</small><strong id="playerName">-</strong></div>
          <div><small>カテゴリー</small><strong id="playerCategory">-</strong></div>
          <div><small>作成日</small><strong id="createdDate">-</strong></div>
        </div>
      </header>

      <div class="report-body">
        <div class="summary-grid">
          <section class="box">
            <h3>身体測定</h3>
            <div id="bodySummary" class="data-list"></div>
          </section>

          <section class="box">
            <h3>アジリティ</h3>
            <div id="agilitySummary" class="data-list"></div>
          </section>

          <section class="box full">
            <h3>シューティング</h3>
            <div id="shootingSummary" class="data-list"></div>
          </section>
        </div>

        <div class="coach-title">
          <strong>コーチ所見</strong>
          <span>現在の成長と次の取り組み</span>
        </div>

        <section class="section good">
          <h3>いいところ</h3>
          <div id="goodText" class="text">未記入</div>
        </section>

        <section class="section improve">
          <h3>改善点</h3>
          <div id="improvementText" class="text">未記入</div>
        </section>

        <section class="section direction">
          <h3>方向性</h3>
          <div id="directionText" class="text">未記入</div>
        </section>

        <section class="section overall">
          <h3>総合所見</h3>
          <div id="overallText" class="text">未記入</div>
        </section>
      </div>

      <footer class="report-footer">
        NINJA AIRS U15
      </footer>
    </article>
  </section>

  <section id="errorView" class="hidden">
    <div class="error">
      <strong>カルテを開けませんでした</strong>
      <div id="errorText"></div>
    </div>
  </section>
</div>

<script>
'use strict';

const LIFF_ID = '2010789200-d4tyvqcE';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxbnca_UIigFLiSfTGOtlU4871H_cm9rHy8iutFT5P9HJR5w3TBvBoA0IZ5fQWkUJRw/exec';

window.addEventListener('load',init);
document.getElementById('printBtn').addEventListener('click',savePdf);

async function init(){
  try{
    if(!window.liff) throw new Error('LIFF SDKを読み込めませんでした。');

    await withTimeout(
      liff.init({liffId:LIFF_ID}),
      15000,
      'LINE認証の初期化がタイムアウトしました。'
    );

    if(!liff.isLoggedIn()){
      liff.login();
      return;
    }

    const idToken=liff.getIDToken();
    if(!idToken) throw new Error('LINE認証情報を取得できませんでした。');

    const result=await jsonp({
      action:'playerCard.listMine',
      idToken
    });

    if(!result||result.status==='error'||result.success===false){
      throw new Error(result&&result.message?result.message:'選手カルテを取得できませんでした。');
    }

    render(result);
  }catch(error){
    showError(error&&error.message?error.message:String(error));
  }
}

function render(data){
  const player=data.player||{};
  setText('playerName',player.name||player.playerName||'選手');
  setText('playerCategory',player.category||'未設定');
  setText('createdDate',formatDateOnly(data.generatedAt||new Date().toISOString()));

  renderBody(data.growth&&Array.isArray(data.growth.records)?data.growth.records:[]);
  renderAgility(data.agility&&Array.isArray(data.agility.records)?data.agility.records:[]);
  renderShooting(data.shooting||null);
  renderFeedback(data.feedback||null);

  document.title=`${player.name||player.playerName||'選手'}_選手カルテ`;
  showOnly('reportView');
}

function renderBody(records){
  const box=document.getElementById('bodySummary');
  if(!records.length){
    box.innerHTML='<div class="note">記録はありません。</div>';
    return;
  }

  const sorted=[...records].sort((a,b)=>dateKey(a)-dateKey(b));
  const first=sorted[0]||{};
  const latest=sorted[sorted.length-1]||{};

  const rows=[
    ['初回',`${formatShortDate(first.date||first.measuredAtIso)} / 身長 ${valueUnit(first.height,'cm')} / 体重 ${valueUnit(first.weight,'kg')}`],
    ['最新',`${formatShortDate(latest.date||latest.measuredAtIso)} / 身長 ${valueUnit(latest.height,'cm')} / 体重 ${valueUnit(latest.weight,'kg')}`]
  ];

  const hd=number(latest.height)-number(first.height);
  const wd=number(latest.weight)-number(first.weight);

  if(Number.isFinite(hd)&&first.height!==''&&latest.height!==''){
    rows.push(['身長変化',signed(hd,'cm')]);
  }
  if(Number.isFinite(wd)&&first.weight!==''&&latest.weight!==''){
    rows.push(['体重変化',signed(wd,'kg')]);
  }

  box.innerHTML=rows.map(([k,v])=>rowHtml(k,v)).join('');
}

function renderAgility(records){
  const box=document.getElementById('agilitySummary');
  if(!records.length){
    box.innerHTML='<div class="note">記録はありません。</div>';
    return;
  }

  const grouped={};
  records.forEach(r=>{
    const name=String(r.event||r.type||r.item||r.measurement||r.name||'').trim();
    if(!name)return;
    if(!grouped[name]||dateKey(r)>=dateKey(grouped[name])) grouped[name]=r;
  });

  const rows=Object.entries(grouped)
    .slice(0,8)
    .map(([name,r])=>[
      name,
      `${agilityValue(r)}${r.date||r.measuredAt||r.measuredAtIso?` (${formatShortDate(r.date||r.measuredAt||r.measuredAtIso)})`:''}`
    ]);

  box.innerHTML=rows.length
    ? rows.map(([k,v])=>rowHtml(k,v)).join('')
    : '<div class="note">表示できる記録がありません。</div>';
}

function renderShooting(shooting){
  const box=document.getElementById('shootingSummary');
  if(!shooting){
    box.innerHTML='<div class="note">記録はありません。</div>';
    return;
  }

  const total=shooting.total||{};
  const made=firstNumber(total.made,total.success,total.makes,total.hit);
  const attempts=firstNumber(total.attempts,total.shots,total.total,total.trials);
  const records=firstNumber(total.records,shooting.records);

  const rows=[];
  if(attempts!==null&&made!==null){
    const pct=attempts>0?(made/attempts*100).toFixed(1):'0.0';
    rows.push(['全体',`${made}/${attempts}本（${pct}%）`]);
  }else if(records!==null){
    rows.push(['記録数',`${records}件`]);
  }

  const types=Array.isArray(shooting.byType)?shooting.byType:[];
  types.slice(0,8).forEach(item=>{
    const label=String(item.type||item.shotType||item.name||'').trim();
    if(!label)return;
    const m=firstNumber(item.made,item.success,item.makes,item.hit);
    const a=firstNumber(item.attempts,item.shots,item.total,item.trials);
    if(m!==null&&a!==null){
      const pct=a>0?(m/a*100).toFixed(1):'0.0';
      rows.push([label,`${m}/${a}本（${pct}%）`]);
    }
  });

  box.innerHTML=rows.length
    ? rows.map(([k,v])=>rowHtml(k,v)).join('')
    : '<div class="note">シュート記録はありますが、集計表示できる項目がありません。</div>';
}

function renderFeedback(feedback){
  if(!feedback){
    setText('goodText','未記入');
    setText('improvementText','未記入');
    setText('directionText','未記入');
    setText('overallText','未記入');
    return;
  }

  const direct={
    good:cleanRichText(feedback.goodPoints||''),
    improve:cleanRichText(feedback.improvementPoints||''),
    direction:cleanRichText(feedback.futureDirection||''),
    summary:cleanRichText(feedback.overallComment||'')
  };

  if(!direct.good||!direct.improve||!direct.direction||!direct.summary){
    const parsed=parseFeedback(feedback.feedbackText||'');
    direct.good=direct.good||parsed.good;
    direct.improve=direct.improve||parsed.improve;
    direct.direction=direct.direction||parsed.direction;
    direct.summary=direct.summary||parsed.summary;
  }

  setText('goodText',direct.good||'未記入');
  setText('improvementText',direct.improve||'未記入');
  setText('directionText',direct.direction||'未記入');
  setText('overallText',direct.summary||cleanRichText(feedback.feedbackText||'')||'未記入');
}

function parseFeedback(text){
  const raw=String(text||'')
    .replace(/<br\s*\/?>/gi,'\n')
    .replace(/\r\n?/g,'\n')
    .trim();

  const result={good:'',improve:'',direction:'',summary:''};
  if(!raw)return result;

  const aliases={
    good:['いいところ','良いところ'],
    improve:['改善点'],
    direction:['方向性'],
    summary:['総合所見']
  };

  const lines=raw.split('\n');
  let current='';
  const bucket={good:[],improve:[],direction:[],summary:[]};

  for(const line of lines){
    const normalized=normalizeHeading(line);
    let hit='';
    Object.entries(aliases).some(([key,list])=>{
      if(list.includes(normalized)){hit=key;return true}
      return false;
    });
    if(hit){current=hit;continue}
    if(current)bucket[current].push(line);
  }

  Object.keys(bucket).forEach(key=>{
    result[key]=cleanRichText(bucket[key].join('\n'));
  });

  return result;
}

function normalizeHeading(line){
  return String(line||'')
    .replace(/^\s*#{1,6}\s*/,'')
    .replace(/\*\*/g,'')
    .replace(/^[【\[]?/,'')
    .replace(/[】\]]?$/,'')
    .replace(/[：:]$/,'')
    .replace(/\s+/g,'')
    .trim();
}

function cleanRichText(value){
  return String(value||'')
    .replace(/<br\s*\/?>/gi,'\n')
    .replace(/<[^>]+>/g,'')
    .replace(/^\s*#{1,6}\s*/gm,'')
    .replace(/\*\*/g,'')
    .trim();
}

function agilityValue(r){
  const candidates=[
    r.value,r.result,r.score,r.count,r.time,r.seconds,r.record,
    r.shuttle,r.verticalJump,r.sideStep,r.lCone,r.ryuRun
  ];
  const found=candidates.find(v=>v!==undefined&&v!==null&&String(v).trim()!=='');
  return found===undefined?'記録あり':String(found);
}

function savePdf(){
  const oldTitle=document.title;
  const name=document.getElementById('playerName').textContent||'選手';
  const d=new Date();
  const ym=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  document.title=`${name}_選手カルテ_${ym}`;
  setTimeout(()=>{
    window.print();
    setTimeout(()=>{document.title=oldTitle},600);
  },50);
}

function rowHtml(label,value){
  return `<div class="data-row"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`;
}

function valueUnit(value,unit){
  return value===undefined||value===null||String(value).trim()===''?'未記録':`${value}${unit}`;
}

function signed(value,unit){
  if(!Number.isFinite(value))return '未記録';
  const fixed=Math.abs(value-Math.round(value))<0.001?String(Math.round(value)):value.toFixed(1);
  return `${value>0?'+':''}${fixed}${unit}`;
}

function number(v){
  const n=Number(v);
  return Number.isFinite(n)?n:NaN;
}

function firstNumber(...values){
  for(const v of values){
    if(v===undefined||v===null||String(v).trim()==='')continue;
    const n=Number(v);
    if(Number.isFinite(n))return n;
  }
  return null;
}

function dateKey(obj){
  if(!obj)return 0;
  const raw=typeof obj==='string'?obj:(obj.date||obj.measuredAt||obj.measuredAtIso||obj.createdAt||obj.updatedAt||'');
  const time=Date.parse(String(raw||'').replace(/\//g,'-'));
  return Number.isFinite(time)?time:0;
}

function formatShortDate(value){
  const text=String(value||'').trim();
  if(!text)return '日付なし';
  const m=text.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
  return m?`${Number(m[2])}/${Number(m[3])}`:text;
}

function formatDateOnly(value){
  const d=new Date(value);
  if(!Number.isNaN(d.getTime())){
    return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
  }
  return String(value||'');
}

function setText(id,text){
  document.getElementById(id).textContent=text==null?'':String(text);
}

function showOnly(id){
  ['loadingView','reportView','errorView'].forEach(viewId=>{
    document.getElementById(viewId).classList.toggle('hidden',viewId!==id);
  });
  window.scrollTo({top:0,behavior:'instant'});
}

function showError(message){
  let text=String(message||'');
  if(text.includes('LINE')&&(text.includes('連携')||text.includes('選手'))){
    text='このLINEアカウントは選手情報と連携されていません。コーチへ連絡してください。';
  }
  setText('errorText',text||'エラーが発生しました。');
  showOnly('errorView');
}

function jsonp(params,timeoutMs=25000){
  return new Promise((resolve,reject)=>{
    const callback='__ninjaPlayerCard_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    const timer=setTimeout(()=>{
      cleanup();
      reject(new Error('サーバー通信がタイムアウトしました。'));
    },timeoutMs);

    function cleanup(){
      clearTimeout(timer);
      try{delete window[callback]}catch(_){}
      if(script.parentNode)script.parentNode.removeChild(script);
    }

    window[callback]=data=>{
      cleanup();
      resolve(data);
    };

    const query=new URLSearchParams({
      ...params,
      callback,
      _ts:String(Date.now())
    }).toString();

    script.src=GAS_URL+'?'+query;
    script.onerror=()=>{
      cleanup();
      reject(new Error('Apps Scriptへ接続できませんでした。'));
    };

    document.head.appendChild(script);
  });
}

function withTimeout(promise,ms,message){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error(message)),ms))
  ]);
}

function esc(value){
  return String(value==null?'':value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
</script>
</body>
</html>
